on:
  push:
    branches: [ main ]  # Or master, whichever branch you use

name: Deploy Laravel to cPanel via FTP
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Sync via FTP
        uses: SamKirkland/[email protected]
        with:
          server: ${{ secrets.FTP_SERVER }}       # e.g. ftp.asianfeast.uk or your server IP
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/               # Path where Laravel’s public directory should go
          local-dir: .                          # Root of your project

