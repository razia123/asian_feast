name: Deploy Laravel to cPanel via FTP

on:
  push:
    branches:
      - main   # or master, depending on your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Sync via FTP
        uses: SamKirkland/FTP-Deploy-Action   # <- Action repo, not your repo
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/        # Where Laravel’s public files should go
          local-dir: public/              # Upload only public folder
